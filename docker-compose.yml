# 生产环境用 PostgreSQL
# 开发期用 SQLite（main/data/dev.db）
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tq_iquant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TQ_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
