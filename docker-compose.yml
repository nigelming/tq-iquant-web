services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tq_iquant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TQ_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:latest
    ports:
      - "4222:4222"

volumes:
  pgdata:
